[project]
name = "uavwnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rnagao", email = "nagao1234@poli.ufrj.br" }
]
requires-python = ">=3.13"
dependencies = [
    "gradysim==0.6.11",
    "gymnasium>=1.3.0",
    "numpy>=2.5.2",
    "pettingzoo>=1.26.1",
    "scipy>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]
# Grupo opcional: só para LER os checkpoints do MADDPG que Lamenza publicou no
# submodule (`.cleanrl_model` é um arquivo do `torch.save`). Não treinamos nada
# com torch, e ele não entra na instalação padrão porque são ~200 MB para uma
# medição de baseline. Ver `scripts/spec02_baseline_maddpg.py`.
baseline = [
    "torch>=2.0",
]
# NÃO existe grupo `ppo`, e a razão é um conflito medido, não esquecimento:
# `ray[rllib]` fixa `gymnasium==1.2.2` no máximo e este projeto exige `>=1.3.0`.
# São incompatíveis no mesmo ambiente.
#
# O treino com o PPO do RLlib roda, portanto, num ambiente EFÊMERO e separado, e
# se comunica com o projeto por arquivo — o checkpoint em NumPy. Isso é o que a
# RNF-11 já queria de todo modo: torch no treino, NumPy puro na medição. Ver
# `scripts/spec06_ppo_anbubus.py` para a invocação.

[tool.pytest.ini_options]
# `vendor/` é código de terceiros carregado como submodule: não coletar os
# testes dele nem tratá-lo como pacote nosso.
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv", ".git"]
