<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-labelledby="t1 d1">
  <title id="t1">Incerteza da estimativa de um sensor contra o número de medições</title>
  <desc id="d1">Duas curvas decrescentes: a estimativa de um sensor medido de perto converge muito mais rápido que a de um medido de longe, mas ambas param no mesmo piso, dado pelo viés fixo do sensor.</desc>
  <defs>
    <marker id="ax1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#808A96"/>
    </marker>
  </defs>

  <line x1="70" y1="250" x2="660" y2="250" stroke="#808A96" stroke-width="1.2" marker-end="url(#ax1)"/>
  <line x1="70" y1="250" x2="70" y2="38" stroke="#808A96" stroke-width="1.2" marker-end="url(#ax1)"/>
  <text x="360" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#808A96">medições acumuladas do mesmo sensor  (k)</text>
  <text x="26" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#808A96" transform="rotate(-90 26 140)">incerteza  σ</text>

  <line x1="70" y1="230.9" x2="660" y2="230.9" stroke="#C08A34" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="655" y="224" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#C08A34">piso do viés  σ_b</text>

  <polyline points="78.9,58.1 87.8,113.7 105.6,152.6 141.3,179.8 212.5,198.6 355,211.3 640,219.5" fill="none" stroke="#8B95A1" stroke-width="2.2"/>
  <text x="150" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#8B95A1">medido de longe — R(d) grande</text>

  <polyline points="78.9,189.7 87.8,205.2 105.6,215.5 141.3,222.1 212.5,226.1 355,228.4 640,229.6" fill="none" stroke="#3E9A90" stroke-width="2.6"/>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#3E9A90">medido de perto — R(d) pequeno</text>

  <circle cx="78.9" cy="58.1" r="3" fill="#8B95A1"/>
  <circle cx="78.9" cy="189.7" r="3" fill="#3E9A90"/>
</svg>
